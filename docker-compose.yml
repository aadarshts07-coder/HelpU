version: '3.8'

services:
  # Caddy Reverse Proxy with Automatic HTTPS (Let's Encrypt / ZeroSSL)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # HELP U Next.js Full-Stack Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY}"
      CREDENTIAL_SALT: "${CREDENTIAL_SALT}"
    volumes:
      - helpu_data:/app/data
      - helpu_resumes:/app/public/resumes
      - helpu_screenshots:/app/public/screenshots
    depends_on:
      - redis
      - postgres

  # Redis for Queues & Rate Limiting
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Production PostgreSQL Database with Automated Persistence
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-helpu}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-helpu}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U helpu -d helpu" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  helpu_data:
  helpu_resumes:
  helpu_screenshots:
  redis_data:
  pg_data:
